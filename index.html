<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>项目进度总览</title>
<style>
  :root{
    --bg:#f6f7fb; --panel:#ffffff; --panel2:#fafbfc; --text:#1b1f27; --muted:#6b7280;
    --border:#e7e9ee; --accent:#4f46e5; --accent-soft:#eef0ff; --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.05);
    --green:#16a34a; --blue:#2563eb; --amber:#f59e0b; --red:#dc2626; --gray:#94a3b8; --indigo:#6366f1;
  }
  [data-theme="dark"]{
    --bg:#0b0e14; --panel:#141821; --panel2:#181c26; --text:#e6e8ee; --muted:#9aa1ac;
    --border:#242a35; --accent:#7c7ff0; --accent-soft:#1d2030; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); line-height:1.5; -webkit-font-smoothing:antialiased; padding:24px 20px 64px; font-size:15px}
  .wrap{max-width:1220px;margin:0 auto}
  .topbar{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .titleblock{min-width:0}
  h1{font-size:24px;margin:0 0 4px;font-weight:700;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:13px;margin:0}
  .sub b{color:var(--text)}
  .spacer{flex:1}
  .theme-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);
    border:1px solid var(--border);background:var(--panel);border-radius:10px;padding:7px 12px;cursor:pointer;transition:.15s}
  .theme-btn:hover{color:var(--text)}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 16px;min-width:96px;box-shadow:var(--shadow)}
  .stat b{display:block;font-size:22px;font-weight:700;line-height:1.2}
  .stat span{color:var(--muted);font-size:12px}
  .stat.active b{color:var(--blue)} .stat.done b{color:var(--green)} .stat.open b{color:var(--indigo)} .stat.mod b{color:var(--accent)}
  .tabs{display:inline-flex;gap:4px;background:var(--panel2);border:1px solid var(--border);border-radius:11px;padding:4px;margin-bottom:14px}
  .tabs button{border:0;background:transparent;color:var(--muted);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:550}
  .tabs button.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
  .search{position:relative;flex:1;min-width:220px}
  .search input{width:100%;padding:10px 12px 10px 34px;border-radius:10px;border:1px solid var(--border);
    background:var(--panel);color:var(--text);font-size:14px;outline:none}
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .search .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
  select{padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:14px;outline:none;cursor:pointer}
  select:focus{border-color:var(--accent)}
  .refresh{cursor:pointer;border:1px solid var(--border);background:var(--panel);color:var(--muted);border-radius:10px;padding:10px 12px;font-size:14px;transition:.15s}
  .refresh:hover{color:var(--text)}
  .banner{display:none;background:var(--accent-soft);color:var(--accent);border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:16px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;gap:12px;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .card-head{display:flex;align-items:flex-start;gap:10px}
  .card-title{font-size:17px;font-weight:650;margin:0;flex:1;min-width:0;letter-spacing:-.01em}
  .card-title a{color:inherit;text-decoration:none}
  .card-title a:hover{color:var(--accent)}
  .badge{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap;line-height:1.4}
  .b-done{background:rgba(22,163,74,.14);color:var(--green)}
  .b-active,.b-doing{background:rgba(37,99,235,.14);color:var(--blue)}
  .b-paused{background:rgba(245,158,11,.16);color:#b45309}
  .b-blocked{background:rgba(220,38,38,.14);color:var(--red)}
  .b-todo{background:rgba(148,163,184,.18);color:#64748b}
  .b-high{background:rgba(239,68,68,.14);color:#dc2626}
  .b-medium{background:rgba(245,158,11,.16);color:#b45309}
  .b-low{background:rgba(148,163,184,.18);color:#64748b}
  .repo{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;text-decoration:none;margin-top:2px}
  .repo:hover{color:var(--accent)} .repo svg{opacity:.7}
  .desc{color:var(--muted);font-size:13.5px;margin:0}
  .progress-label{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted)}
  .progress-label b{color:var(--text);font-weight:650;font-size:14px}
  .bar{height:8px;border-radius:999px;background:var(--panel2);border:1px solid var(--border);overflow:hidden;margin-top:5px}
  .bar > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),#7c7ff0);transition:width .4s ease}
  .dates{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}
  details{border:1px solid var(--border);border-radius:12px;background:var(--panel2);overflow:hidden}
  details summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;padding:10px 12px;font-weight:600;font-size:13.5px;user-select:none}
  details summary::-webkit-details-marker{display:none}
  details summary .chev{margin-left:auto;transition:transform .2s;color:var(--muted)}
  details[open] summary .chev{transform:rotate(90deg)}
  details .cnt{font-size:11px;color:var(--muted);font-weight:500;background:var(--panel);border:1px solid var(--border);border-radius:999px;padding:1px 7px}
  .detail-body{padding:6px 12px 12px;display:flex;flex-direction:column;gap:8px}
  .mod{border:1px solid var(--border);background:var(--panel);border-radius:10px;padding:10px 12px}
  .mod-head{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center}
  .mod-name{font-size:13.5px;font-weight:600}
  .mstatus{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px}
  .mstatus.s-done{background:rgba(22,163,74,.14);color:var(--green)}
  .mstatus.s-doing{background:rgba(37,99,235,.14);color:var(--blue)}
  .mstatus.s-todo{background:rgba(148,163,184,.18);color:#64748b}
  .mbar{height:6px;border-radius:999px;background:var(--panel2);border:1px solid var(--border);overflow:hidden;margin-top:8px}
  .mbar > i{display:block;height:100%;border-radius:999px;background:var(--indigo)}
  .mod-meta{font-size:11.5px;color:var(--muted);margin-top:4px}
  .mod-note{font-size:12px;color:var(--muted);background:var(--panel2);border-radius:8px;padding:6px 8px;margin-top:6px}
  .tasks{margin-top:8px;border-top:1px dashed var(--border);padding-top:8px;display:flex;flex-direction:column;gap:6px}
  .tasks .tl{font-size:11.5px;color:var(--muted);font-weight:600}
  .task{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;font-size:12.5px}
  .task .tdot{width:9px;height:9px;border-radius:50%;background:var(--gray)}
  .task.done .tdot{background:var(--green)} .task.doing .tdot{background:var(--blue)} .task.todo .tdot{background:var(--gray)}
  .task .tname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .task.done .tname{text-decoration:line-through;color:var(--muted)}
  .task .tp{font-size:11px;color:var(--muted);min-width:36px;text-align:right}
  .task .tm{font-size:11px;color:var(--muted);min-width:46px;text-align:right}
  .todo{display:flex;gap:10px;align-items:flex-start}
  .todo .dot{width:18px;height:18px;border-radius:50%;flex:none;margin-top:2px;border:2px solid var(--gray);position:relative}
  .todo.done .dot{background:var(--green);border-color:var(--green)}
  .todo.done .dot::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
  .todo.doing .dot{border-color:var(--blue);background:var(--blue)}
  .todo-t{font-size:13px;font-weight:550}
  .todo.done .todo-t{text-decoration:line-through;color:var(--muted)}
  .todo-m{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:11.5px;margin-top:2px}
  .todo-note{color:var(--muted);font-size:12px;margin-top:2px}
  .modtable{display:flex;flex-direction:column;gap:10px}
  .mtrow{display:grid;grid-template-columns:minmax(190px,1.2fr) minmax(160px,1.6fr) 76px minmax(130px,1fr) 90px 96px;gap:10px;align-items:center}
  .mt-head{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:0 14px}
  .mt{background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px}
  .mt:hover{border-color:var(--accent)}
  .mt-proj{min-width:0}
  .mt-proj .pname{font-weight:650;font-size:13.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mt-proj a{color:inherit;text-decoration:none}.mt-proj a:hover{color:var(--accent)}
  .mt-proj .prepo{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
  .mt-name{font-size:13.5px;font-weight:600}
  .mt .mstatus{justify-self:start}
  .mt-prog{display:flex;align-items:center;gap:8px}
  .mt-prog .mbar{flex:1;margin:0}
  .mt-prog b{font-size:12px;min-width:36px;text-align:right}
  .mt-hours{font-size:12px;color:var(--muted)}
  .mt-date{font-size:11.5px;color:var(--muted)}
  .mt-note{grid-column:1 / -1;font-size:12px;color:var(--muted);background:var(--panel2);border-radius:8px;padding:6px 8px;margin-top:2px}
  .mt-tasks{grid-column:1 / -1;display:flex;flex-direction:column;gap:5px;margin-top:4px}
  .mt-task{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 8px;background:var(--panel2);border-radius:8px}
  .mt-task .tdot{width:9px;height:9px;border-radius:50%;flex:none}
  .mt-task.done .tdot{background:var(--green)} .mt-task.doing .tdot{background:var(--blue)} .mt-task .tdot{background:var(--gray)}
  .mt-task .tn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mt-task.done .tn{text-decoration:line-through;color:var(--muted)}
  .mt-task .tp{font-size:11px;color:var(--muted);min-width:34px;text-align:right}
  .mt-task .tm{font-size:11px;color:var(--muted);min-width:40px;text-align:right}
  .empty{text-align:center;color:var(--muted);padding:60px 0}
  .empty b{font-size:16px;color:var(--text);font-weight:600;display:block;margin-bottom:4px}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:32px}
  @media(max-width:760px){body{padding:16px}h1{font-size:21px}.grid{grid-template-columns:1fr}.mtrow,.mt-head{grid-template-columns:1fr;gap:6px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="titleblock">
      <h1 id="title">项目进度总览</h1>
      <p class="sub" id="subtitle">一个页面管理所有项目 · 数据来源：progress.json</p>
    </div>
    <div class="spacer"></div>
    <button class="theme-btn" id="themeBtn" title="切换主题">🌙 深色</button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="tabs">
    <button id="tabProjects" class="on">🏷️ 项目总览</button>
    <button id="tabModules">🧩 模块总览</button>
  </div>

  <div class="toolbar">
    <div class="search">
      <span class="ico">🔎</span>
      <input id="q" type="search" placeholder="搜索项目 / 仓库 / 模块 / 任务 / 待办…" autocomplete="off" />
    </div>
    <select id="status"></select>
    <select id="repo"><option value="all">全部仓库</option></select>
    <button class="refresh" id="refresh" title="重新读取">↻</button>
  </div>

  <div class="banner" id="banner"></div>
  <div id="content"></div>
  <p class="foot" id="foot"></p>
</div>

<script>
const FALLBACK = {
  meta:{title:"项目进度总览",updatedAt:"2026-08-26T12:00:00Z",note:"本地预览为示例数据"},
  projects:[
    {id:"demo-workspace",name:"工作台 Demo",repo:"yourname/demo-workspace",status:"active",priority:"high",description:"团队协作工作台，核心是任务看板与成员管理。",startDate:"2026-08-05",targetDate:"2026-09-20",
      modules:[
        {name:"登录 / 鉴权",status:"done",progress:100,estHours:16,spentHours:12,updatedAt:"2026-08-10",notes:"支持邮箱 + OAuth，冒烟通过。",
          tasks:[{name:"邮箱登录",status:"done",progress:100,estHours:6,spentHours:4},{name:"OAuth 接入",status:"done",progress:100,estHours:8,spentHours:7},{name:"权限体系",status:"done",progress:100,estHours:4,spentHours:3}]},
        {name:"任务看板",status:"doing",progress:60,estHours:40,spentHours:26,updatedAt:"2026-08-24",notes:"拖拽交互完成，卡片详情待做。",
          tasks:[{name:"拖拽交互",status:"done",progress:100,estHours:14,spentHours:12},{name:"卡片详情弹窗",status:"doing",progress:45,estHours:16,spentHours:8},{name:"看板筛选",status:"todo",progress:0,estHours:10,spentHours:0}]},
        {name:"成员邀请",status:"todo",progress:0,estHours:12,spentHours:0,updatedAt:"2026-08-24",notes:""}
      ],
      todos:[
        {title:"任务卡片支持标签与截止日期",status:"doing",priority:"high",due:"2026-08-28",note:"关联现有筛选逻辑"},
        {title:"写 README / 部署文档",status:"todo",priority:"medium",due:"2026-08-30",note:""}
      ]},
    {id:"demo-api",name:"开放 API",repo:"yourname/demo-api",status:"paused",priority:"medium",description:"对外查询接口与限流服务。",startDate:"2026-08-01",targetDate:"2026-09-10",
      modules:[
        {name:"接口定义",status:"done",progress:100,estHours:8,spentHours:5,updatedAt:"2026-08-12",notes:"OpenAPI 已冻结 v1"},
        {name:"查询服务",status:"doing",progress:45,estHours:30,spentHours:16,updatedAt:"2026-08-20",notes:"主流程可用，待补索引",
          tasks:[{name:"主查询流程",status:"done",progress:100,estHours:14,spentHours:10},{name:"索引优化",status:"doing",progress:40,estHours:10,spentHours:5},{name:"异常降级",status:"todo",progress:0,estHours:6,spentHours:0}]},
        {name:"限流 / 配额",status:"todo",progress:10,estHours:10,spentHours:1,updatedAt:"2026-08-20",notes:""}
      ],
      todos:[
        {title:"确认计费方案（免费自建看板）",status:"doing",priority:"high",due:"2026-08-27",note:"不买团队版"},
        {title:"补充限流压测",status:"todo",priority:"medium",due:"2026-09-05",note:""}
      ]},
    {id:"demo-landing",name:"官网落地页",repo:"yourname/demo-landing",status:"done",priority:"low",description:"产品对外介绍与联系方式。",startDate:"2026-07-20",targetDate:"2026-08-15",
      modules:[
        {name:"视觉稿",status:"done",progress:100,estHours:8,spentHours:10,updatedAt:"2026-07-25",notes:"两版定稿"},
        {name:"打包上线",status:"done",progress:100,estHours:4,spentHours:3,updatedAt:"2026-08-14",notes:"已部署"}
      ],
      todos:[]}
  ]
};

const PROJ_STATUS={active:"进行中",done:"已完成",paused:"已暂停",blocked:"有阻塞"};
const MOD_STATUS={todo:"待开始",doing:"进行中",done:"已完成"};
let data=null, usingFallback=false, view="projects";
const st={q:"",status:"all",repo:"all"};
const $=s=>document.querySelector(s);

function fmtDate(d){if(!d)return "—";const x=new Date(d);if(isNaN(x))return d;return `${x.getMonth()+1}月${x.getDate()}日`;}
function daysLeft(d){if(!d)return null;return Math.ceil((new Date(d)-Date.now())/86400000);}
function clamp(n){return Math.max(0,Math.min(100,n||0));}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

async function load(){usingFallback=false;try{const r=await fetch("progress.json",{cache:"no-store"});if(!r.ok)throw new Error(r.status);data=await r.json();}catch(e){data=FALLBACK;usingFallback=true;}render();}

function taskProg(tasks){if(!tasks||!tasks.length)return null;const tot=tasks.reduce((s,t)=>s+(t.estHours||0),0)||1;return Math.round(tasks.reduce((s,t)=>s+(t.progress||0)*(t.estHours||0),0)/tot);}
function modProg(m){const t=taskProg(m.tasks);return t!==null?t:(m.progress||0);}
function projProg(p){const ms=p.modules||[];if(!ms.length)return p.progress||0;const tot=ms.reduce((s,m)=>s+(m.estHours||0),0)||1;return Math.round(ms.reduce((s,m)=>s+modProg(m)*(m.estHours||0),0)/tot);}

function pstatusClass(s){if(s==="done")return"b-done";if(s==="active"||s==="doing")return"b-active";if(s==="blocked")return"b-blocked";if(s==="paused")return"b-paused";return"b-todo";}
function mstatusClass(s){return s==="done"?"s-done":s==="doing"?"s-doing":"s-todo";}
function prioClass(p){return p==="high"?"b-high":p==="medium"?"b-medium":"b-low";}

function setStatusOptions(){
  const sel=$("#status");
  if(view==="projects"){sel.innerHTML='<option value="all">全部状态</option><option value="active">进行中</option><option value="done">已完成</option><option value="paused">已暂停</option><option value="blocked">有阻塞</option>';}
  else{sel.innerHTML='<option value="all">全部状态</option><option value="doing">进行中</option><option value="done">已完成</option><option value="todo">待开始</option>';}
  sel.value=st.status==="all"||(!viewOptions().includes(st.status)?"all":st.status);
}

function viewOptions(){return view==="projects"?["active","done","paused","blocked"]:["doing","done","todo"];}

function render(){
  document.title=data.meta?.title||"项目进度总览";
  $("#title").textContent=data.meta?.title||"项目进度总览";
  const updated=data.meta?.updatedAt?new Date(data.meta.updatedAt):null;
  $("#subtitle").innerHTML=usingFallback?"本地预览（未读取到 progress.json，显示示例）":
    `一个页面管理所有项目 · 数据来源：progress.json${updated?` · 更新于 ${updated.toLocaleString("zh-CN",{hour12:false})}`:""}`;
  $("#banner").style.display=usingFallback?"block":"none";
  if(usingFallback)$("#banner").textContent="没有读到 progress.json：请把 index.html 与 progress.json 放在同一目录，并部署到 GitHub Pages 后即可正常展示。";

  const projects=data.projects||[];
  const openTodos=projects.reduce((n,p)=>n+(p.todos||[]).filter(t=>t.status!=="done").length,0);
  const mods=projects.reduce((n,p)=>n+(p.modules||[]).length,0);
  $("#stats").innerHTML=stat("总项目",projects.length)+stat("进行中",projects.filter(p=>p.status==="active").length,"active")+
    stat("已完成",projects.filter(p=>p.status==="done").length,"done")+stat("模块数",mods,"mod")+stat("未完成待办",openTodos,"open");

  const repos=[...new Set(projects.map(p=>p.repo).filter(Boolean))];
  const repoSel=$("#repo");const cur=st.repo;
  repoSel.innerHTML='<option value="all">全部仓库</option>'+repos.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join("");
  st.repo=repos.includes(cur)?cur:"all";repoSel.value=st.repo;

  setStatusOptions();
  $("#content").innerHTML = view==="projects" ? renderProjects() : renderModules();
}

function stat(label,num,cls){return `<div class="stat ${cls||""}"><b>${num}</b><span>${label}</span></div>`;}

function projectMatch(p){
  const q=st.q.trim().toLowerCase();
  const hay=[p.name,p.repo,p.description,(p.modules||[]).map(m=>m.name+" "+(m.tasks||[]).map(t=>t.name).join(" ") ).join(" "),(p.todos||[]).map(t=>t.title).join(" ")].join(" ").toLowerCase();
  if(q&&!hay.includes(q))return false;
  if(view==="projects"){if(st.status!=="all"&&p.status!==st.status)return false;}
  if(st.repo!=="all"&&p.repo!==st.repo)return false;
  return true;
}

function renderProjects(){
  const list=(data.projects||[]).filter(projectMatch).sort(cmpProj);
  if(!list.length)return `<div class="empty"><b>没有匹配的项目</b>试试调整搜索或筛选条件</div>`;
  return `<div class="grid">${list.map(card).join("")}</div>`;
}

function cmpProj(a,b){
  const order={active:0,paused:1,blocked:2,done:3};
  if((order[a.status]??4)!==(order[b.status]??4))return (order[a.status]??4)-(order[b.status]??4);
  const pr={high:0,medium:1,low:2};
  if((pr[a.priority]??1)!==(pr[b.priority]??1))return (pr[a.priority]??1)-(pr[b.priority]??1);
  return (b.progress||0)-(a.progress||0);
}

function card(p){
  const mv=projProg(p);const dl=daysLeft(p.targetDate);
  const mods=(p.modules||[]).map(m=>{
    const mp=modProg(m);const tasks=m.tasks||[];
    const taskRows=tasks.length?`<div class="tasks"><div class="tl">子任务 ${tasks.length}</div>${tasks.map(t=>taskRow(t)).join("")}</div>`:"";
    return `<div class="mod">
      <div class="mod-head"><span class="mod-name">${esc(m.name)}</span><span class="mstatus ${mstatusClass(m.status)}">${MOD_STATUS[m.status]||m.status}</span><span class="badge ${prioClass(m.priority||"low")}">${m.priority||"medium"}</span></div>
      <div class="mbar"><i style="width:${mp}%"></i></div>
      <div class="mod-meta">${(m.spentHours||0)}/${(m.estHours||0)} 小时 ${m.updatedAt?`· 更新 ${fmtDate(m.updatedAt)}`:""}</div>
      ${m.notes?`<div class="mod-note">${esc(m.notes)}</div>`:""}${taskRows}
    </div>`;
  }).join("");
  const todos=(p.todos||[]).map(t=>`<div class="todo ${t.status==="done"?"done":(t.status==="doing"?"doing":"pending")}">
      <span class="dot"></span><div><div class="todo-t">${esc(t.title)}</div>
      <div class="todo-m"><span class="badge ${prioClass(t.priority)}">${t.priority}</span>${t.due?`<span>截止 ${fmtDate(t.due)}</span>`:""}</div>
      ${t.note?`<div class="todo-note">${esc(t.note)}</div>`:""}</div></div>`).join("");
  const repo=p.repo?`<a class="repo" href="https://github.com/${esc(p.repo)}" target="_blank" rel="noopener"><svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>${esc(p.repo)}</a>`:"";
  return `<article class="card">
    <div><div class="card-head"><h3 class="card-title"><a href="https://github.com/${esc(p.repo)}" target="_blank" rel="noopener">${esc(p.name)}</a></h3>
      <span class="badge ${pstatusClass(p.status)}">${PROJ_STATUS[p.status]||p.status}</span><span class="badge ${prioClass(p.priority)}">${p.priority}</span></div>
      ${repo}${p.description?`<p class="desc">${esc(p.description)}</p>`:""}
      <div class="progress-label"><span>整体进度</span><b>${mv}%</b></div><div class="bar"><i style="width:${mv}%"></i></div>
      <div class="dates"><span>${fmtDate(p.startDate)} 启动</span><span>目标 ${fmtDate(p.targetDate)}${dl===null?"":dl<0?` · 逾期 ${-dl} 天`:dl<=7?` · 剩余 ${dl} 天`:""}</span></div>
    </div>
    ${mods?`<details ${p.status!=="done"?"open":""}><summary>模块 <span class="cnt">${(p.modules||[]).length}</span><span class="chev">›</span></summary><div class="detail-body">${mods}</div></details>`:""}
    ${todos?`<details ${p.status!=="done"?"open":""}><summary>待办 <span class="cnt">${(p.todos||[]).filter(t=>t.status!=="done").length} 未完成</span><span class="chev">›</span></summary><div class="detail-body">${todos}</div></details>`:""}
  </article>`;
}

function taskRow(t){const stp=t.status||"todo";return `<div class="task ${stp}"><span class="tdot"></span><span class="tname">${esc(t.name)}</span><span class="tp">${clamp(t.progress)}%</span><span class="tm">${(t.spentHours||0)}/${(t.estHours||0)}h</span></div>`;}

function moduleMatch(row){
  const p=row.project,m=row.module,q=st.q.trim().toLowerCase();
  const hay=[p.name,p.repo,m.name,(m.tasks||[]).map(t=>t.name).join(" ")].join(" ").toLowerCase();
  if(q&&!hay.includes(q))return false;
  if(st.repo!=="all"&&p.repo!==st.repo)return false;
  if(view==="modules"&&st.status!=="all"){if(m.status!==st.status)return false;}
  return true;
}

function renderModules(){
  const rows=[];
  for(const p of data.projects||[]){for(const m of p.modules||[]){rows.push({project:p,module:m});}}
  const list=rows.filter(moduleMatch);
  if(!list.length)return `<div class="empty"><b>没有匹配的模块</b>试试调整搜索或筛选条件</div>`;
  const head=`<div class="mtrow mt-head"><span>项目</span><span>模块</span><span>状态</span><span>进度</span><span>工时</span><span>更新</span></div>`;
  return `<div class="modtable">${head}${list.map(mtRow).join("")}</div>`;
}

function mtRow(r){const p=r.project,m=r.module;const mp=modProg(m);const tasks=m.tasks||[];
  const note=m.notes?`<div class="mt-note">${esc(m.notes)}</div>`:"";
  const taskRows=tasks.length?`<div class="mt-tasks">${tasks.map(t=>`<div class="mt-task ${t.status||"todo"}"><span class="tdot"></span><span class="tn">${esc(t.name)}</span><span class="tp">${clamp(t.progress)}%</span><span class="tm">${(t.spentHours||0)}/${(t.estHours||0)}h</span></div>`).join("")}</div>`:"";
  return `<div class="mt">
    <div class="mtrow">
      <div class="mt-proj"><span class="pname"><a href="https://github.com/${esc(p.repo)}" target="_blank" rel="noopener">${esc(p.name)}</a></span><span class="prepo">${esc(p.repo)}</span></div>
      <div class="mt-name">${esc(m.name)}</div>
      <span class="mstatus ${mstatusClass(m.status)}">${MOD_STATUS[m.status]||m.status}</span>
      <div class="mt-prog"><div class="mbar"><i style="width:${mp}%"></i></div><b>${mp}%</b></div>
      <div class="mt-hours">${(m.spentHours||0)}/${(m.estHours||0)}h</div>
      <div class="mt-date">${fmtDate(m.updatedAt)}</div>
    </div>
    ${note}${taskRows}
  </div>`;
}

function bind(){
  $("#q").addEventListener("input",e=>{st.q=e.target.value;render();});
  $("#status").addEventListener("change",e=>{st.status=e.target.value;render();});
  $("#repo").addEventListener("change",e=>{st.repo=e.target.value;render();});
  $("#refresh").addEventListener("click",()=>load());
  $("#tabProjects").addEventListener("click",()=>{view="projects";st.status="all";history.replaceState(null,"",location.pathname);$("#tabProjects").classList.add("on");$("#tabModules").classList.remove("on");render();});
  $("#tabModules").addEventListener("click",()=>{view="modules";st.status="all";history.replaceState(null,"","#modules");$("#tabModules").classList.add("on");$("#tabProjects").classList.remove("on");render();});
  $("#themeBtn").addEventListener("click",()=>{const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",t);localStorage.setItem("theme",t);$("#themeBtn").textContent=t==="dark"?"☀️ 浅色":"🌙 深色";});
  const saved=localStorage.getItem("theme");if(saved==="dark"){document.documentElement.setAttribute("data-theme","dark");$("#themeBtn").textContent="☀️ 浅色";}
}
(function(){
  if(location.hash.replace("#","")==="modules"){view="modules";$("#tabModules").classList.add("on");$("#tabProjects").classList.remove("on");}
  bind();load();
})();
</script>
</body>
</html>
